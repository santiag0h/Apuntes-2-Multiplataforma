<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 8 · Tema 2 · Sincronización y sección crítica</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#1d2330;--sub:#5b6474;--line:#dfe3ea;--acc:#3b5bdb;--ok:#2b8a3e;--okbg:#e6f4ea;--ko:#c92a2a;--kobg:#fdecec;--code:#f1f3f5}
@media (prefers-color-scheme:dark){:root{--bg:#15181e;--card:#1e222a;--txt:#e6e9ef;--sub:#9aa3b2;--line:#323844;--acc:#7c95f2;--ok:#69db7c;--okbg:#1f3326;--ko:#ff8787;--kobg:#3a2224;--code:#262b34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 20px 64px}
a{color:var(--acc)}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--sub);margin:0 0 24px}
.barra{position:sticky;top:0;background:var(--bg);padding:10px 0;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:1}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.q h2{font-size:1rem;margin:0 0 12px;font-weight:600}
.q h2 span{color:var(--sub);font-weight:500;margin-right:6px}
pre{background:var(--code);border-radius:8px;padding:12px 14px;overflow-x:auto;font:13.5px/1.45 Consolas,"Cascadia Code",monospace;margin:0 0 12px}
.op{display:block;width:100%;text-align:left;background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;font:inherit;cursor:pointer}
.op:hover:not(:disabled){border-color:var(--acc)}
.op:disabled{cursor:default}
.op.ok{border-color:var(--ok);background:var(--okbg)}
.op.ko{border-color:var(--ko);background:var(--kobg)}
.exp{display:none;margin-top:10px;padding:10px 12px;border-left:3px solid var(--acc);color:var(--txt);background:var(--code);border-radius:0 8px 8px 0}
.exp b.ok{color:var(--ok)} .exp b.ko{color:var(--ko)}
.fin{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center}
.fin p{font-size:1.2rem;margin:0 0 12px}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
ul.lista{list-style:none;padding:0}
ul.lista li{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
ul.lista a{display:block;padding:12px 16px;text-decoration:none;color:var(--txt)}
ul.lista a:hover{color:var(--acc)}
ul.lista small{color:var(--sub);float:right}
</style>
</head>
<body>
<main>
<p><a href="index.html">← Todos los tests</a></p>
<h1>Test 8 · Tema 2 · Sincronización y sección crítica</h1>
<p class="sub">PSP · 10 preguntas. Las preguntas y las opciones se mezclan cada vez que repites el test.</p>
<div class="barra"><span>Aciertos: <b id="marcador"></b></span></div>
<div id="preguntas"></div>
<div class="fin" id="fin"><p id="nota"></p><button class="btn" id="repetir">Repetir test</button></div>
</main>
<script type="application/json" id="datos">[{"enunciado": "¿Qué código puede ejecutarse de forma asíncrona?", "correcta": "El que no afecta a datos compartidos", "incorrectas": ["El que modifica datos compartidos", "Cualquier código dentro de un synchronized", "Solo el del hilo principal"], "explicacion": "Asíncrono: no toca datos compartidos. Síncrono: sí los toca y hay que controlarlo."}, {"enunciado": "Los hilos A y B escriben en la misma variable de salida. ¿Qué condición incumplen?", "correcta": "Independencia de salida", "incorrectas": ["Independencia de flujo", "Atomicidad", "Exclusión mutua"], "explicacion": "Las salidas de A y de B deben ser distintas. La de flujo exige que las entradas de uno no sean salidas del otro."}, {"enunciado": "¿Por qué a++ NO es una operación atómica?", "correcta": "Porque son tres pasos (leer, sumar y guardar) y otro hilo puede meterse en medio", "incorrectas": ["Porque solo funciona con enteros", "Porque Java no tiene operaciones atómicas", "Sí es atómica"], "explicacion": "Una operación atómica sucede «de una vez» y no se puede interrumpir."}, {"enunciado": "¿Qué es una sección crítica?", "correcta": "El trozo de código en el que se accede a una variable o recurso compartido", "incorrectas": ["El método main", "El código que lanza una excepción", "El método run() de cualquier hilo"], "explicacion": "Mientras un hilo está en su sección crítica, ningún otro puede ejecutar la suya."}, {"enunciado": "Un hilo está en su sección crítica y otro quiere entrar en la suya. ¿Qué pasa?", "correcta": "El segundo se bloquea hasta que el primero termine", "incorrectas": ["Entran los dos a la vez", "El primero se interrumpe para dejarle paso", "El segundo lanza una excepción"], "explicacion": "Es la exclusión mutua: solo uno dentro a la vez."}, {"enunciado": "¿Cuál de estas NO es una exigencia de la sección crítica?", "correcta": "El hilo de mayor prioridad entra siempre primero", "incorrectas": ["Ningún hilo debería esperar indefinidamente para entrar", "No se puede suponer nada sobre la velocidad relativa de los hilos", "Si un hilo se interrumpe dentro, puede bloquear a los demás"], "explicacion": "La prioridad no garantiza nada. Las otras tres aparecen en el tema."}, {"enunciado": "¿Qué es un mutex?", "correcta": "Una variable booleana asociada a un objeto que indica si está bloqueado (locked) o desbloqueado (unlocked)", "incorrectas": ["Un hilo especial que controla a los demás", "Un tipo de cola FIFO", "Un método de la clase Thread"], "explicacion": "Viene de mutual exclusion: se bloquea al usar el objeto y se desbloquea al terminar."}, {"enunciado": "¿Qué dos problemas puede producir el uso de mutex?", "correcta": "Interbloqueo e inanición", "incorrectas": ["Condición de carrera e inconsistencia de memoria", "Bloqueo activo y espera activa", "Ninguno"], "explicacion": "Interbloqueo (como un cruce de tráfico) e inanición (un proceso poco importante siempre esperando)."}, {"enunciado": "Un proceso comprueba constantemente, cada pocos ciclos de CPU, si puede entrar en su sección crítica. ¿Qué solución es?", "correcta": "Espera activa", "incorrectas": ["Semáforo", "Monitor", "Variable cerrojo"], "explicacion": "Gasta CPU comprobando. Los semáforos lo evitan durmiendo al proceso."}, {"enunciado": "¿Qué es una variable cerrojo?", "correcta": "Una variable que controla el acceso: el hilo consulta su valor y, si indica que está libre, entra en su sección crítica", "incorrectas": ["Una variable final que no se puede modificar", "Un semáforo con valor 0", "Un hilo que bloquea a los demás"], "explicacion": "Es una de las soluciones por software, junto con la espera activa."}]</script>
<script>
const datos = JSON.parse(document.getElementById('datos').textContent);
const zona = document.getElementById('preguntas');
const marcador = document.getElementById('marcador');
const fin = document.getElementById('fin');
let aciertos = 0, respondidas = 0;

function mezclar(a) {
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function pintar() {
    aciertos = 0; respondidas = 0;
    zona.innerHTML = '';
    fin.style.display = 'none';
    actualizar();
    mezclar(datos.slice()).forEach((p, n) => {
        const caja = document.createElement('div');
        caja.className = 'q';
        const h = document.createElement('h2');
        const num = document.createElement('span');
        num.textContent = (n + 1) + '.';
        h.append(num, document.createTextNode(p.enunciado));
        caja.append(h);
        if (p.codigo) {
            const pre = document.createElement('pre');
            pre.textContent = p.codigo;
            caja.append(pre);
        }
        const exp = document.createElement('div');
        exp.className = 'exp';
        const opciones = mezclar([{t: p.correcta, ok: true}, ...p.incorrectas.map(t => ({t, ok: false}))]);
        const botones = [];
        opciones.forEach(o => {
            const b = document.createElement('button');
            b.className = 'op';
            b.textContent = o.t;
            b.onclick = () => {
                botones.forEach(x => {
                    x.disabled = true;
                    if (x._ok) x.classList.add('ok');
                });
                if (!o.ok) b.classList.add('ko'); else aciertos++;
                respondidas++;
                const v = document.createElement('b');
                v.className = o.ok ? 'ok' : 'ko';
                v.textContent = o.ok ? '¡Correcto! ' : 'Incorrecto. ';
                exp.append(v, document.createTextNode(p.explicacion));
                exp.style.display = 'block';
                actualizar();
            };
            b._ok = o.ok;
            botones.push(b);
            caja.append(b);
        });
        caja.append(exp);
        zona.append(caja);
    });
}

function actualizar() {
    marcador.textContent = aciertos + ' / ' + respondidas + ' (de ' + datos.length + ')';
    if (respondidas === datos.length) {
        const nota = (aciertos * 10 / datos.length).toFixed(1).replace('.', ',');
        document.getElementById('nota').textContent =
            'Has acertado ' + aciertos + ' de ' + datos.length + ' · Nota: ' + nota;
        fin.style.display = 'block';
    }
}

document.getElementById('repetir').onclick = () => { pintar(); window.scrollTo(0, 0); };
pintar();
</script>
</body>
</html>
