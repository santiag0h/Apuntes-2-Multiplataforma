<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 1 · Tema 1 · Conceptos básicos y sistema operativo</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#1d2330;--sub:#5b6474;--line:#dfe3ea;--acc:#3b5bdb;--ok:#2b8a3e;--okbg:#e6f4ea;--ko:#c92a2a;--kobg:#fdecec;--code:#f1f3f5}
@media (prefers-color-scheme:dark){:root{--bg:#15181e;--card:#1e222a;--txt:#e6e9ef;--sub:#9aa3b2;--line:#323844;--acc:#7c95f2;--ok:#69db7c;--okbg:#1f3326;--ko:#ff8787;--kobg:#3a2224;--code:#262b34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 20px 64px}
a{color:var(--acc)}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--sub);margin:0 0 24px}
.barra{position:sticky;top:0;background:var(--bg);padding:10px 0;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:1}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.q h2{font-size:1rem;margin:0 0 12px;font-weight:600}
.q h2 span{color:var(--sub);font-weight:500;margin-right:6px}
pre{background:var(--code);border-radius:8px;padding:12px 14px;overflow-x:auto;font:13.5px/1.45 Consolas,"Cascadia Code",monospace;margin:0 0 12px}
.op{display:block;width:100%;text-align:left;background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;font:inherit;cursor:pointer}
.op:hover:not(:disabled){border-color:var(--acc)}
.op:disabled{cursor:default}
.op.ok{border-color:var(--ok);background:var(--okbg)}
.op.ko{border-color:var(--ko);background:var(--kobg)}
.exp{display:none;margin-top:10px;padding:10px 12px;border-left:3px solid var(--acc);color:var(--txt);background:var(--code);border-radius:0 8px 8px 0}
.exp b.ok{color:var(--ok)} .exp b.ko{color:var(--ko)}
.fin{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center}
.fin p{font-size:1.2rem;margin:0 0 12px}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
ul.lista{list-style:none;padding:0}
ul.lista li{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
ul.lista a{display:block;padding:12px 16px;text-decoration:none;color:var(--txt)}
ul.lista a:hover{color:var(--acc)}
ul.lista small{color:var(--sub);float:right}
</style>
</head>
<body>
<main>
<p><a href="index.html">← Todos los tests</a></p>
<h1>Test 1 · Tema 1 · Conceptos básicos y sistema operativo</h1>
<p class="sub">PSP · 10 preguntas. Las preguntas y las opciones se mezclan cada vez que repites el test.</p>
<div class="barra"><span>Aciertos: <b id="marcador"></b></span></div>
<div id="preguntas"></div>
<div class="fin" id="fin"><p id="nota"></p><button class="btn" id="repetir">Repetir test</button></div>
</main>
<script type="application/json" id="datos">[{"enunciado": "¿Qué es un proceso?", "correcta": "Un programa en ejecución, que además tiene PID, permisos, contador de programa, imagen de memoria y estado del procesador", "incorrectas": ["El archivo guardado en disco con el código del programa", "Un programa que se ejecuta siempre en segundo plano", "La parte central del sistema operativo"], "explicacion": "Un proceso no es solo código y datos: también tiene identificador, permisos, contador de programa, imagen de memoria y estado del procesador."}, {"enunciado": "¿Qué es un ejecutable?", "correcta": "Un archivo con la información necesaria para crear un proceso a partir de un programa", "incorrectas": ["Un proceso que ya está en memoria", "Un proceso no interactivo", "Una rutina de tratamiento de interrupciones"], "explicacion": "El sistema operativo crea el proceso a partir de lo que hay en el ejecutable."}, {"enunciado": "Un demonio (daemon) es…", "correcta": "Un proceso no interactivo que se ejecuta en segundo plano y suele dar un servicio al resto de procesos", "incorrectas": ["Un proceso que ha terminado pero no ha liberado recursos", "El primer proceso que crea el kernel", "Un virus que se ejecuta en segundo plano"], "explicacion": "No es interactivo, está siempre ejecutándose en segundo plano y da servicios básicos."}, {"enunciado": "¿Cuál de estos NO es un objetivo del sistema operativo según el tema?", "correcta": "Compilar el código fuente de los programas", "incorrectas": ["Ejecutar programas de usuario", "Hacer el ordenador cómodo de utilizar", "Utilizar los recursos de forma eficiente"], "explicacion": "Los tres objetivos son ejecutar programas, hacer cómodo el ordenador y repartir bien los recursos."}, {"enunciado": "El kernel funciona a base de…", "correcta": "Interrupciones", "incorrectas": ["Hilos", "Colas FIFO", "Procesos demonio"], "explicacion": "El conjunto de todas las rutinas de tratamiento de interrupciones forma el kernel."}, {"enunciado": "¿Qué es una interrupción?", "correcta": "La suspensión temporal de un proceso para ejecutar una rutina del SO; al terminar, el proceso sigue justo donde se quedó", "incorrectas": ["La finalización definitiva de un proceso", "Un error que obliga a reiniciar el proceso", "Un cambio de prioridad de un proceso"], "explicacion": "Cuando acaba la rutina, el proceso se reanuda en el punto exacto donde se quedó."}, {"enunciado": "Según el tema, ¿el sistema operativo es un proceso demonio?", "correcta": "No, solo se ejecuta en respuesta a interrupciones", "incorrectas": ["Sí, es el demonio principal del sistema", "Sí, porque siempre está en segundo plano", "No, es un proceso interactivo"], "explicacion": "El SO no está ejecutándose continuamente: actúa cuando salta una interrupción."}, {"enunciado": "Llega una interrupción mientras se está atendiendo otra. ¿Qué pasa?", "correcta": "Solo se atiende si es de nivel superior", "incorrectas": ["Siempre se atiende inmediatamente", "Se pierde siempre", "Se reinicia el proceso desde el principio"], "explicacion": "Mientras se atiende una interrupción no entran otras, salvo que sean de nivel superior."}, {"enunciado": "¿Qué valor tiene el bit de modo cuando se ejecuta en modo kernel?", "correcta": "0", "incorrectas": ["1", "Depende del proceso", "El modo kernel no usa bit de modo"], "explicacion": "Modo kernel = 0 y modo usuario = 1. El trap pasa a 0 y el return vuelve a 1."}, {"enunciado": "¿Por qué existen las llamadas al sistema?", "correcta": "Para evitar que un programa de usuario ejecute directamente instrucciones peligrosas", "incorrectas": ["Para que el programa de usuario vaya más rápido", "Para que los procesos compartan memoria", "Para crear el árbol de procesos"], "explicacion": "Son la interfaz del kernel. Lo delicado solo se ejecuta en modo kernel, así que el error de un programa no afecta a otros."}]</script>
<script>
const datos = JSON.parse(document.getElementById('datos').textContent);
const zona = document.getElementById('preguntas');
const marcador = document.getElementById('marcador');
const fin = document.getElementById('fin');
let aciertos = 0, respondidas = 0;

function mezclar(a) {
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function pintar() {
    aciertos = 0; respondidas = 0;
    zona.innerHTML = '';
    fin.style.display = 'none';
    actualizar();
    mezclar(datos.slice()).forEach((p, n) => {
        const caja = document.createElement('div');
        caja.className = 'q';
        const h = document.createElement('h2');
        const num = document.createElement('span');
        num.textContent = (n + 1) + '.';
        h.append(num, document.createTextNode(p.enunciado));
        caja.append(h);
        if (p.codigo) {
            const pre = document.createElement('pre');
            pre.textContent = p.codigo;
            caja.append(pre);
        }
        const exp = document.createElement('div');
        exp.className = 'exp';
        const opciones = mezclar([{t: p.correcta, ok: true}, ...p.incorrectas.map(t => ({t, ok: false}))]);
        const botones = [];
        opciones.forEach(o => {
            const b = document.createElement('button');
            b.className = 'op';
            b.textContent = o.t;
            b.onclick = () => {
                botones.forEach(x => {
                    x.disabled = true;
                    if (x._ok) x.classList.add('ok');
                });
                if (!o.ok) b.classList.add('ko'); else aciertos++;
                respondidas++;
                const v = document.createElement('b');
                v.className = o.ok ? 'ok' : 'ko';
                v.textContent = o.ok ? '¡Correcto! ' : 'Incorrecto. ';
                exp.append(v, document.createTextNode(p.explicacion));
                exp.style.display = 'block';
                actualizar();
            };
            b._ok = o.ok;
            botones.push(b);
            caja.append(b);
        });
        caja.append(exp);
        zona.append(caja);
    });
}

function actualizar() {
    marcador.textContent = aciertos + ' / ' + respondidas + ' (de ' + datos.length + ')';
    if (respondidas === datos.length) {
        const nota = (aciertos * 10 / datos.length).toFixed(1).replace('.', ',');
        document.getElementById('nota').textContent =
            'Has acertado ' + aciertos + ' de ' + datos.length + ' · Nota: ' + nota;
        fin.style.display = 'block';
    }
}

document.getElementById('repetir').onclick = () => { pintar(); window.scrollTo(0, 0); };
pintar();
</script>
</body>
</html>
