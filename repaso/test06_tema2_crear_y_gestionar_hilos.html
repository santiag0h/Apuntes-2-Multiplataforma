<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 6 · Tema 2 · Crear y gestionar hilos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#1d2330;--sub:#5b6474;--line:#dfe3ea;--acc:#3b5bdb;--ok:#2b8a3e;--okbg:#e6f4ea;--ko:#c92a2a;--kobg:#fdecec;--code:#f1f3f5}
@media (prefers-color-scheme:dark){:root{--bg:#15181e;--card:#1e222a;--txt:#e6e9ef;--sub:#9aa3b2;--line:#323844;--acc:#7c95f2;--ok:#69db7c;--okbg:#1f3326;--ko:#ff8787;--kobg:#3a2224;--code:#262b34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 20px 64px}
a{color:var(--acc)}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--sub);margin:0 0 24px}
.barra{position:sticky;top:0;background:var(--bg);padding:10px 0;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:1}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.q h2{font-size:1rem;margin:0 0 12px;font-weight:600}
.q h2 span{color:var(--sub);font-weight:500;margin-right:6px}
pre{background:var(--code);border-radius:8px;padding:12px 14px;overflow-x:auto;font:13.5px/1.45 Consolas,"Cascadia Code",monospace;margin:0 0 12px}
.op{display:block;width:100%;text-align:left;background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;font:inherit;cursor:pointer}
.op:hover:not(:disabled){border-color:var(--acc)}
.op:disabled{cursor:default}
.op.ok{border-color:var(--ok);background:var(--okbg)}
.op.ko{border-color:var(--ko);background:var(--kobg)}
.exp{display:none;margin-top:10px;padding:10px 12px;border-left:3px solid var(--acc);color:var(--txt);background:var(--code);border-radius:0 8px 8px 0}
.exp b.ok{color:var(--ok)} .exp b.ko{color:var(--ko)}
.fin{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center}
.fin p{font-size:1.2rem;margin:0 0 12px}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
ul.lista{list-style:none;padding:0}
ul.lista li{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
ul.lista a{display:block;padding:12px 16px;text-decoration:none;color:var(--txt)}
ul.lista a:hover{color:var(--acc)}
ul.lista small{color:var(--sub);float:right}
</style>
</head>
<body>
<main>
<p><a href="index.html">← Todos los tests</a></p>
<h1>Test 6 · Tema 2 · Crear y gestionar hilos</h1>
<p class="sub">PSP · 10 preguntas. Las preguntas y las opciones se mezclan cada vez que repites el test.</p>
<div class="barra"><span>Aciertos: <b id="marcador"></b></span></div>
<div id="preguntas"></div>
<div class="fin" id="fin"><p id="nota"></p><button class="btn" id="repetir">Repetir test</button></div>
</main>
<script type="application/json" id="datos">[{"enunciado": "¿Qué método crea realmente el hilo y hace que empiece a ejecutar su run()?", "correcta": "start()", "incorrectas": ["run()", "new Thread()", "join()"], "explicacion": "start() es la operación create: la JVM crea el hilo y este ejecuta run()."}, {"enunciado": "¿Cuántos métodos tiene la interfaz Runnable?", "correcta": "Uno: run()", "incorrectas": ["Dos: start() y run()", "Ninguno", "Todos los de Thread"], "explicacion": "run() contiene el código del hilo; es algo así como su main()."}, {"enunciado": "¿Qué relación hay entre la clase Thread y la interfaz Runnable?", "correcta": "La propia clase Thread implementa Runnable", "incorrectas": ["Runnable hereda de Thread", "No tienen relación", "Thread es una interfaz y Runnable una clase"], "explicacion": "Por eso, al heredar de Thread, también sobrescribes run()."}, {"enunciado": "¿Por qué Runnable es la opción que más se usa?", "correcta": "Porque la clase puede seguir heredando de otra clase distinta de Thread", "incorrectas": ["Porque trae más métodos que Thread", "Porque no necesita run()", "Porque es más rápida"], "explicacion": "Si heredas de Thread, ya no puedes heredar de otra clase."}, {"enunciado": "Si implementas Runnable, ¿qué más necesitas para arrancar el hilo?", "correcta": "Crear un objeto Thread que lo envuelva y llamar a su start()", "incorrectas": ["Nada, basta con llamar a run()", "Heredar también de Thread", "Llamar a join()"], "explicacion": "Runnable solo aporta run(); el hilo lo pone un objeto Thread."}, {"enunciado": "El main llama a hilo.join(). ¿Qué pasa?", "correcta": "El main se queda esperando hasta que ese hilo termine", "incorrectas": ["El hilo espera al main", "Los dos hilos se juntan en uno", "El main duerme un tiempo fijo"], "explicacion": "Espera quien llama a join() (el main) hasta que termina el hilo del objeto."}, {"enunciado": "¿Qué es cierto sobre Thread.sleep(milis)?", "correcta": "Duerme al hilo que lo llama, que no consume CPU mientras duerme; el tiempo puede no ser exacto", "incorrectas": ["Duerme a todos los hilos del proceso", "Siempre duerme exactamente esos milisegundos", "El hilo sigue consumiendo CPU mientras duerme"], "explicacion": "sleep es estático, afecta al hilo actual y su precisión depende del SO."}, {"enunciado": "¿Qué devuelve Thread.currentThread()?", "correcta": "Una referencia al hilo que se está ejecutando en ese momento", "incorrectas": ["El número de hilos del proceso", "El estado del hilo", "El hilo principal siempre"], "explicacion": "Es un método static que devuelve un Thread."}, {"enunciado": "¿Qué hace isAlive()?", "correcta": "Comprueba si el hilo sigue vivo, es decir, si no ha terminado su run()", "incorrectas": ["Arranca el hilo", "Despierta a un hilo dormido", "Devuelve la prioridad del hilo"], "explicacion": "Devuelve un boolean."}, {"enunciado": "Lanzas 3 hilos que escriben letras distintas. ¿En qué orden salen?", "correcta": "Mezcladas, y la mezcla cambia en cada ejecución", "incorrectas": ["Siempre en el orden de los start()", "Siempre primero el último lanzado", "En orden alfabético"], "explicacion": "Cada hilo lanzado tiene vida propia y el planificador decide quién usa la CPU."}]</script>
<script>
const datos = JSON.parse(document.getElementById('datos').textContent);
const zona = document.getElementById('preguntas');
const marcador = document.getElementById('marcador');
const fin = document.getElementById('fin');
let aciertos = 0, respondidas = 0;

function mezclar(a) {
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function pintar() {
    aciertos = 0; respondidas = 0;
    zona.innerHTML = '';
    fin.style.display = 'none';
    actualizar();
    mezclar(datos.slice()).forEach((p, n) => {
        const caja = document.createElement('div');
        caja.className = 'q';
        const h = document.createElement('h2');
        const num = document.createElement('span');
        num.textContent = (n + 1) + '.';
        h.append(num, document.createTextNode(p.enunciado));
        caja.append(h);
        if (p.codigo) {
            const pre = document.createElement('pre');
            pre.textContent = p.codigo;
            caja.append(pre);
        }
        const exp = document.createElement('div');
        exp.className = 'exp';
        const opciones = mezclar([{t: p.correcta, ok: true}, ...p.incorrectas.map(t => ({t, ok: false}))]);
        const botones = [];
        opciones.forEach(o => {
            const b = document.createElement('button');
            b.className = 'op';
            b.textContent = o.t;
            b.onclick = () => {
                botones.forEach(x => {
                    x.disabled = true;
                    if (x._ok) x.classList.add('ok');
                });
                if (!o.ok) b.classList.add('ko'); else aciertos++;
                respondidas++;
                const v = document.createElement('b');
                v.className = o.ok ? 'ok' : 'ko';
                v.textContent = o.ok ? '¡Correcto! ' : 'Incorrecto. ';
                exp.append(v, document.createTextNode(p.explicacion));
                exp.style.display = 'block';
                actualizar();
            };
            b._ok = o.ok;
            botones.push(b);
            caja.append(b);
        });
        caja.append(exp);
        zona.append(caja);
    });
}

function actualizar() {
    marcador.textContent = aciertos + ' / ' + respondidas + ' (de ' + datos.length + ')';
    if (respondidas === datos.length) {
        const nota = (aciertos * 10 / datos.length).toFixed(1).replace('.', ',');
        document.getElementById('nota').textContent =
            'Has acertado ' + aciertos + ' de ' + datos.length + ' · Nota: ' + nota;
        fin.style.display = 'block';
    }
}

document.getElementById('repetir').onclick = () => { pintar(); window.scrollTo(0, 0); };
pintar();
</script>
</body>
</html>
